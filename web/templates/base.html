<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pi-AI-Trader{% endblock %}</title>

    <!--
        All assets load from CDN. If the Pi is offline, replace these with
        locally-downloaded copies in web/static/.
    -->

    <!-- Bootstrap 5 for responsive layout and components -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Project CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    {% block head %}{% endblock %}
</head>
<body class="bg-dark text-light">

<!-- =========================================================================
     Navigation bar
     ========================================================================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-success" href="/">
            <i class="bi bi-activity"></i> Pi-AI-Trader
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}"
                       href="/">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard.performance' %}active{% endif %}"
                       href="/performance">
                        <i class="bi bi-graph-up-arrow"></i> Performance
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard.logs' %}active{% endif %}"
                       href="/logs">
                        <i class="bi bi-terminal"></i> Logs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard.settings' %}active{% endif %}"
                       href="/settings">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>
            </ul>

            <!-- Engine status indicator — updated by status polling -->
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary" id="engine-status-badge">
                    <i class="bi bi-circle-fill text-warning"></i>
                    Checking...
                </span>
                <span class="text-muted small" id="paper-trading-badge"></span>
            </div>
        </div>
    </div>
</nav>

<!-- =========================================================================
     Main content area
     ========================================================================= -->
<main class="container-fluid py-3">
    {% block content %}{% endblock %}
</main>

<!-- =========================================================================
     Footer
     ========================================================================= -->
<footer class="text-center text-muted small py-2 border-top border-secondary mt-4">
    Pi-AI-Trader &mdash; Local Network Only &mdash;
    <span id="footer-time"></span>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

<!-- Socket.IO client (version must match Flask-SocketIO server version) -->
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

<!-- Project JS -->
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

{% block scripts %}{% endblock %}
</body>
</html>
